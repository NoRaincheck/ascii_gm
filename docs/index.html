<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Game Master</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23313344'/><text x='8' y='12' font-size='10' text-anchor='middle' fill='%2389b4fa' font-family='monospace'>A</text></svg>">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div id="app">
      <h1>ASCII Game Master</h1>
      <div id="toolbar">
        <button id="generate-btn">Generate</button>
        <select id="theme-select">
          <option value="macchiato">Macchiato (Dark)</option>
          <option value="latte">Latte (Light)</option>
        </select>
        <select id="layout-select">
          <option value="portrait">Portrait</option>
          <option value="landscape">Landscape</option>
        </select>
        <label class="toggle-label">
          <span id="mode-label">Image Mode</span>
          <button id="mode-toggle" class="toggle-btn">Switch to Canvas Mode</button>
        </label>
      </div>
      <div id="main">
        <div id="card-container">
          <div class="card-grid"></div>
        </div>
        <div id="game-container"></div>
      </div>
    </div>
    <script type="module" src="app.js"></script>
  </body>
</html>
